name: 'CI - Conventional Commit Validation'

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest.gitignore
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@1.4.1
        with:
          task_types: '["feat","fix","release"]'
          custom_labels: '{"feat": "feature", "fix": "fix", "release": "release"}'
